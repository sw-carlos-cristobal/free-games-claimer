# start with `docker compose up`
services:
  free-games-claimer:
    container_name: fgc # is printed in front of every output line
    image: ghcr.io/sw-carlos-cristobal/free-games-claimer # fork image from GHCR
    build: .
    ports:
      # - "5900:5900" # VNC server
      - "6080:6080" # noVNC (browser-based VNC client)
    volumes:
      - fgc:/fgc/data
    # command: bash -c "node epic-games; node gog"
    environment:
      # - EMAIL=foo@bar.org
      # - NOTIFY='tgram://...'
